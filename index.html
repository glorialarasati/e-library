<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | E-Library Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">

  <main class="login-wrap">
    <p class="login-badge">Digital Library Management System</p>

    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-logo"><span class="material-symbols-outlined" aria-hidden="true">menu_book</span></div>
      <h1 id="loginTitle">E-Library Admin</h1>
      <p class="login-sub">Sign in to access the administrative dashboard</p>

      <div class="alert" id="loginAlert" role="alert" hidden></div>

      <form id="loginForm" novalidate>
        <div class="field" id="field-email">
          <label for="email">Email address</label>
          <input type="email" id="email" autocomplete="username" aria-describedby="err-email">
          <p class="error" id="err-email"></p>
        </div>

        <div class="field" id="field-password">
          <label for="password">Password</label>
          <input type="password" id="password" autocomplete="current-password" aria-describedby="err-password">
          <button type="button" class="icon-btn toggle-pass" id="togglePass" aria-label="Show password">
            <span class="material-symbols-outlined" aria-hidden="true">visibility</span>
          </button>
          <p class="error" id="err-password"></p>
        </div>

        <div class="login-row">
          <label class="radio"><input type="checkbox" id="remember"> Remember me</label>
          <a href="#" id="forgotLink" class="link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
          <span class="material-symbols-outlined" aria-hidden="true">lock</span>Login
        </button>
      </form>

      <p class="login-hint">Demo account: <strong>admin@elibrary.test</strong> / <strong>admin123</strong></p>
      <p class="login-foot">Need administrator credentials? <a href="#" id="supportLink" class="link">Contact support</a></p>
    </section>
  </main>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>
  <script src="assets/js/login.js"></script>
</body>
</html>
